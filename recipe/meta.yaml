{% set name = "plotly-resampler" %}
{% set version = "0.11.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/predict-idlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f5e406a70ce7d6dd51ca8ba269f221dd65c3145a0d6fe4f26ed50e7ae22c4b64

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -v --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - numpy {{ numpy }}
    - pip
    - wheel
    - setuptools
    - poetry-core 2.5.0
  run:
    - python
    - plotly >=5.5.0,<7.0.0
    - dash >=2.11.0
    - pandas >=1  # [py<313]
    - pandas >=2.2.3  # [py>=313]
    - numpy >=1.14  # [py<311]
    - numpy >=1.24  # [py>=311 and py<313]
    - numpy >=2.0  # [py>=313]
    - orjson >=3.10.0,<4.0.0
    - tsdownsample >=0.1.3
  run_constrained:
    - flask-cors >=4.0.2,<5
    - python-kaleido ==0.2.1

# E   ModuleNotFoundError: No module named 'pytest_lazyfixture' - pytest-lazy-fixture = "^0.6.3"
# E   ModuleNotFoundError: No module named 'seleniumwire' - selenium-wire = "^5.0"
# >   def __copy__(self):
# >   raise NotImplementedError("Widgets cannot be copied; custom implementation required")
# E   NotImplementedError: Widgets cannot be copied; custom implementation required
{% set ignore_tests = " --ignore=tests/test_rangeslider.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_aggregators.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_figure_resampler_selenium.py" %}
{% set deselect_tests = " --deselect=tests/test_figure_resampler.py::test_various_dtypes" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_figure_resampler.py::test_fr_update_layout_axes_range" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_figure_resampler.py::test_fr_update_layout_axes_range_no_update" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_serialization.py::test_copy_and_deepcopy_figurewidget_resampler" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_serialization.py::test_copy_figurewidget_resampler_registered" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_serialization.py::test_deepcopy_figurewidget_resampler_registered" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_utils.py::test_is_figurewidget" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_utils.py::test_is_fwr" %}

test:
  source_files:
    - tests
  imports:
    - plotly_resampler
    - plotly_resampler.aggregation.gap_handler_interface
    - plotly_resampler.figure_resampler.figure_resampler_interface
  commands:
    - pip check
    - pytest -vv tests {{ ignore_tests }} {{ deselect_tests }}
  requires:
    - pip
    - pytest >=8.3.4  # [win and arm64]
    - pytest >=7.2.0,<8  # [not (win and arm64)]
    # The selenium version must be ==4.2.0, relaxed for the tests:
    - selenium >=4.2.0
    - anywidget >=0.9.13,<1
    # Needed for `dash`
    - setuptools

about:
  home: https://github.com/predict-idlab/plotly-resampler
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Visualizing large time series with plotly
  description: |
    Plotly is an awesome interactive visualization library, however it can get pretty slow
    when a lot of data points are visualized (100 000+ datapoints). Plotly-resampler
    solves this by downsampling (aggregating) the data respective to the view and then
    plotting the aggregated points. When you interact with the plot (panning, zooming, ...),
    callbacks are used to aggregate data and update the figure.
  doc_url: https://github.com/predict-idlab/plotly-resampler/blob/main/README.md
  dev_url: https://github.com/predict-idlab/plotly-resampler

extra:
  recipe-maintainers:
    - jvdd
    - thewchan
